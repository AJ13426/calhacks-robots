<title>Relay</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full bleed 3D floor. Copy column top left, set like an engineering drawing note: slide number and a hairline rule, a plain headline, one supporting line, one control. Quiet footer rail. One light theme, one accent (Relay green). */
:root{
  --paper:#E9ECEE; --ink:#121518; --muted:#535C63; --soft:#7F888F; --rule:rgba(18,21,24,.16);
  --relay:#12805C; --embed:#2C6FB7; --lang:#8A9096; --bad:#C8392B; --amber:#D99A2B; --steel:#3D6E99;
  --font:"Instrument Sans", "Helvetica Neue", Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:600;white-space:nowrap;padding:3px 7px;background:#FAFAF9;color:var(--ink);border:1px solid var(--rule);transition:opacity .3s}
.tag.off{opacity:0}
.tag.bad{background:var(--bad);color:#fff;border-color:var(--bad)}.tag.good{background:var(--relay);color:#fff;border-color:var(--relay)}
.tag.code{font-family:var(--mono);font-weight:400;font-size:11px}
.tag.say{white-space:normal;width:210px;font-weight:500;line-height:1.35;padding:6px 8px}
.tag.status{white-space:normal;width:160px;font-weight:500;line-height:1.3;padding:5px 8px;transform:translate(-50%,-115%)}
.tag.status b{display:block;font-size:11px}
.tag.belief{font-family:var(--mono);font-weight:500;font-size:11px}
.tag.belief.wrong{border-color:var(--bad);color:var(--bad)}.tag.belief.right{border-color:var(--relay);color:var(--relay)}

#copy{position:fixed;left:max(48px, env(safe-area-inset-left,0px));top:calc(40px + env(safe-area-inset-top,0px));width:min(540px,42vw);display:flex;flex-direction:column;gap:16px;max-height:calc(100% - 140px);overflow:auto;padding-right:4px}
#copy > *{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
#copy > *:nth-child(2){animation-delay:.06s}#copy > *:nth-child(3){animation-delay:.12s}#copy > *:nth-child(4){animation-delay:.18s}#copy > *:nth-child(5){animation-delay:.24s}#copy > *:nth-child(6){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.no{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--soft);border-top:1.5px solid var(--ink);padding-top:8px}
h1{margin:0;font-size:clamp(34px,3.6vw,54px);font-weight:600;line-height:1.04;letter-spacing:-.02em;text-wrap:balance}
.sub{margin:0;font-size:clamp(16px,1.35vw,19px);line-height:1.45;color:var(--muted);max-width:40ch}
.sub b{color:var(--ink);font-weight:600}
.fig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.fig .n{font-size:clamp(48px,5vw,76px);font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.fig .l{font-size:15px;color:var(--ink);max-width:24ch;line-height:1.35}
.src{font-size:12px;color:var(--soft)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px;border-top:1px solid var(--rule);padding-top:14px}
.cols h3{margin:0 0 6px;font-size:16px;font-weight:600}.cols p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font-family:var(--font);font-size:15px;font-weight:600;cursor:pointer;border-radius:0;padding:9px 16px;border:1.5px solid var(--ink);background:var(--ink);color:#FAFAF9}
button.ghost{background:transparent;color:var(--ink)}
button.go{background:var(--relay);border-color:var(--relay)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--relay);outline-offset:2px}
pre{margin:0;font-family:var(--mono);font-size:12px;line-height:1.55;background:rgba(250,250,249,.88);border-left:2px solid var(--relay);padding:10px 12px;overflow-x:auto;white-space:pre;color:#2A3036}
pre .c{color:var(--soft)}pre .k{color:var(--relay)}
/* VLA anatomy */
.vla{display:grid;grid-template-columns:1fr 150px;gap:6px 14px;align-items:center}
.vla .box{border:1.5px solid var(--ink);background:rgba(250,250,249,.9);padding:7px 10px;font-size:14px;font-weight:600;position:relative}
.vla .box small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.vla .box.ins{border-style:dashed;font-weight:500}
.vla .arrow{height:12px;border-left:1.5px solid var(--ink);margin-left:20px}
.vla .tap{display:flex;align-items:center;gap:8px;background:transparent;border:1.5px solid var(--rule);color:var(--ink);padding:7px 9px;font-size:13.5px;text-align:left}
.vla .tap i{width:10px;height:10px;display:block;flex:none}
.vla .tap[aria-pressed="true"]{border-color:var(--ink);background:rgba(250,250,249,.9)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;border-top:1px solid var(--rule);padding-top:10px}
.detail span:nth-child(odd){color:var(--soft)}
/* bars */
.bars{display:flex;flex-direction:column;gap:12px;width:min(440px,100%)}
.bar{display:grid;grid-template-columns:90px 1fr 70px;gap:12px;align-items:center;font-size:15px}
.bar .t{height:14px;background:rgba(18,21,24,.07)}.bar .t i{display:block;height:100%;transition:width .9s cubic-bezier(.2,.7,.2,1)}
.bar b{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
/* form */
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
.form input,.form select{font-family:var(--font);font-size:17px;font-weight:600;border:1.5px solid var(--rule);border-radius:0;background:rgba(250,250,249,.92);padding:7px 9px;width:100%;color:var(--ink)}
.form .wide{grid-column:span 4}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:7px}.legend i{width:20px;height:3px;display:block}
/* crews */
.crews{display:flex;gap:8px;flex-wrap:wrap}
.crews button{background:transparent;color:var(--ink);border-color:var(--rule);display:flex;align-items:center;gap:8px;padding:8px 12px}
.crews button i{width:10px;height:10px;display:block}
.crews button[aria-pressed="true"]{border-color:var(--ink);background:rgba(250,250,249,.9)}
.roster{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.roster button{font-size:12.5px;padding:6px 6px;background:rgba(250,250,249,.9);color:var(--ink);border:1.5px solid var(--rule);border-left-width:5px;text-align:left}
.links{font-size:13.5px;line-height:1.5;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.links b{color:var(--ink);font-weight:600}
/* phone */
.phone{width:250px;border:2px solid var(--ink);border-radius:26px;background:#FAFAF9;padding:14px 12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 18px 40px -20px rgba(0,0,0,.35)}
.phone .top{display:flex;justify-content:space-between;font-size:12px;font-weight:600}
.phone .top span:last-child{color:var(--relay)}
.phone .alert{background:var(--bad);color:#fff;font-size:12px;padding:6px 8px;line-height:1.3}
.phone .alert[hidden]{display:none}
.phone .r{display:grid;grid-template-columns:8px 1fr;gap:8px;font-size:12.5px;line-height:1.3;border-top:1px solid var(--rule);padding-top:7px}
.phone .r i{width:8px;height:8px;margin-top:4px}.phone .r b{font-weight:600}.phone .r span{color:var(--muted)}
.road{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--rule);padding-top:12px}
.road div{display:grid;grid-template-columns:90px 1fr;gap:14px;align-items:baseline}
.road small{font-family:var(--mono);font-size:11.5px;color:var(--relay)}.road b{font-size:17px;font-weight:600}

#score{position:fixed;right:max(40px, env(safe-area-inset-right,0px));top:calc(40px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:14px;align-items:flex-end;text-align:right;border-top:1.5px solid var(--ink);padding-top:8px}
#score .m{display:flex;flex-direction:column;align-items:flex-end}
#score .v{font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
#score .k{font-size:12.5px;color:var(--muted)}
#score .p{font-family:var(--mono);font-size:11.5px;color:var(--soft)}
#score .v.bad{color:var(--bad)}#score .v.ok{color:var(--relay)}

#bar{position:fixed;left:max(48px, env(safe-area-inset-left,0px));right:max(48px, env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:18px}
#sec{font-size:13px;font-weight:600;min-width:170px}#sec span{font-family:var(--mono);color:var(--soft);font-weight:400;margin-left:8px;font-size:11.5px}
#prog{flex:1;display:flex;gap:3px;min-width:0}
#prog button{flex:1;height:3px;padding:0;border:0;background:rgba(18,21,24,.15)}
#prog button.done{background:rgba(18,21,24,.45)}#prog button.cur{background:var(--ink)}
#prog .gap{flex:0 0 14px}
.ctl{display:flex;gap:8px;align-items:center}.ctl button{padding:7px 12px;font-size:13px}
.ctl select{font-family:var(--font);font-size:13px;border:0;background:transparent;color:var(--muted);font-weight:600}
#notes{position:fixed;left:max(48px, env(safe-area-inset-left,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100% - 96px));background:#15181B;color:#E6E9EB;padding:14px 18px;font-size:15px;line-height:1.5}
#notes[hidden]{display:none!important}
#insp{position:fixed;right:0;top:0;bottom:0;width:min(380px,100vw);background:#FAFAF9;border-left:1.5px solid var(--ink);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.7,.2,1);z-index:5}
#insp.on{transform:none}
.ih{display:flex;justify-content:space-between;align-items:center;padding:calc(18px + env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) 14px 20px;border-bottom:1px solid var(--rule)}
.ih h3{margin:0;font-size:20px;font-weight:600}
.ib{overflow:auto;padding:14px max(20px, env(safe-area-inset-right,0px)) 24px 20px;display:flex;flex-direction:column;gap:18px;font-size:14px}
.ib h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:600}
.ib table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.ib td,.ib th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--rule)}.ib th{color:var(--muted);font-weight:500}
.ib td.bad{color:var(--bad);font-weight:600}.ib td.ok{color:var(--relay);font-weight:600}
.ib .log{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
#err{position:fixed;left:16px;bottom:60px;max-width:70vw;font-size:12px;color:var(--bad);white-space:pre-wrap;z-index:9}
@media (max-width:820px){
  #copy{left:max(18px, env(safe-area-inset-left,0px));right:max(18px, env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));width:auto;gap:10px;max-height:52vh;background:rgba(233,236,238,.94);padding:0 0 10px}
  h1{font-size:28px}.sub{font-size:15px}.fig .n{font-size:44px}.cols{gap:14px}.vla{grid-template-columns:1fr 120px}
  #score{top:auto;bottom:calc(60px + env(safe-area-inset-bottom,0px));right:max(18px, env(safe-area-inset-right,0px));flex-direction:row;gap:16px;border:0}#score .v{font-size:22px}
  #bar{left:max(18px, env(safe-area-inset-left,0px));right:max(18px, env(safe-area-inset-right,0px));gap:10px}#sec{min-width:0;font-size:12px}.ctl select{display:none}
  .phone{width:220px}
}
@media (prefers-reduced-motion: reduce){#copy > *{animation:none}}
</style>

<div id="notes" hidden></div>

</div>

let cam=null;const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function shotFor(k){const S={
  wide:{t:[.3,.4,.3],dir:[1,.85,1.45],zoom:.92},end:{t:[1.2,.45,.2],dir:[.75,.7,1.5],zoom:1.55},talk:{t:[-.3,.95,-.2],dir:[.8,.6,1.5],zoom:1.05},
  calm:{t:[.3,.5,.4],dir:[1.2,.75,1.1],zoom:1.0},hive:{t:[-.2,1.1,-.5],dir:[.7,.55,1.5],zoom:1.2},picker:{t:[1.1,.6,.1],dir:[.9,.55,1.4],zoom:2.0},
  claim:{t:[-.6,.6,-.4],dir:[.55,.6,1.5],zoom:1.9},subs:{t:[-.3,1.0,-.3],dir:[.85,.65,1.45],zoom:1.12},beat:{t:[1.4,.5,.5],dir:[.8,.75,1.4],zoom:1.5},
  ring:{t:[RG.x,.3,0],dir:[.35,1,1.25],zoom:.9},finale:{t:[FX.x,.4,0],dir:[.75,.95,1.25],zoom:.62},close:{t:[FX.x,.6,0],dir:[1.2,.7,.9],zoom:.7}};return S[k]||S.wide}
function camTo(k,instant){const p=shotFor(k),tgt=new V3(...p.t),pos=tgt.clone().add(new V3(...p.dir).normalize().multiplyScalar(18));
  if(instant||!controls){cam=null;camera.position.copy(pos);camera.zoom=p.zoom;camera.updateProjectionMatrix();if(controls)controls.target.copy(tgt);camera.lookAt(tgt);return}
  const far=camera.position.distanceTo(pos)>12;cam={t:0,ms:far?1900:1400,p0:camera.position.clone(),p1:pos,t0:controls.target.clone(),t1:tgt,z0:camera.zoom,z1:p.zoom,dip:far?.25:0}}
function stepCam(dt){if(!cam)return;cam.t+=dt;const u=Math.min(1,cam.t/cam.ms),e=ease(u);camera.position.lerpVectors(cam.p0,cam.p1,e);controls.target.lerpVectors(cam.t0,cam.t1,e);
  camera.zoom=(cam.z0+(cam.z1-cam.z0)*e)*(1-cam.dip*Math.sin(u*Math.PI));camera.updateProjectionMatrix();camera.lookAt(controls.target);if(u>=1)cam=null}

{sec:3,cam:'subs',setup(){nodes(true,true);tDB.show();tRel.show();startSim('language',{schedule:[[1.5,VSLOW],[14,VNOM]],quiet:false});beliefs(true)},
 html:()=>`<h1>Messages give every robot its own copy of the floor. Copies drift.</h1><p class="sub">With ROS topics, MQTT, or an LLM relay, each robot rebuilds the world from what it was told. SpacetimeDB keeps <b>one copy</b>, and every robot reads that.</p><div class="row"><button class="go" data-onecopy>Switch to one shared copy</button></div>`,
 notes:'Why a database at all? With messaging, ROS topics, MQTT, or an LLM relay, every robot keeps its own picture of the floor, built from whatever messages reached it. Look at the tags: each robot’s idea of the belt speed is different, and some are wrong. SpacetimeDB is a relational database that is also the server. There is one copy of the state, held in memory with a commit log on disk, and every robot reads it. Click the button and every robot’s picture snaps to the truth.'},

 html:()=>`<h1>Reducers turn safety rules into transactions.</h1><p class="sub">A reducer is the only way to change a table. It runs inside the database and either commits completely or rolls back.</p>
 <pre><span class="k">export const</span> claim_handoff = spacetimedb.reducer(
  { zone: t.string(), robot: t.string() },
  (ctx, { zone, robot }) =&gt; {
    const held = ctx.db.handoff.zone.find(zone);
    <span class="k">if</span> (held &amp;&amp; held.robot !== robot)
      <span class="k">throw new</span> SenderError(\`\${zone} is held\`);
    ctx.db.handoff.zone.update({ zone, robot });
  });</pre><div class="row"><button class="go" data-claim>Both arms claim zone A</button></div>`,
 notes:'Reducers are where Relay’s safety rules live. A reducer is the only way to change a table, and it runs as a transaction inside the database, so it either fully commits or fully rolls back. Here both arms try to claim the same handoff zone in the same instant. One claim commits, the other rolls back, and the second arm waits until the zone is released. No robot can skip this rule, because there is no other way to write the data.'},

]);
conn.db.line_state.onUpdate((ctx, old, row) =&gt;

 html:()=>`<h1>Scheduled reducers notice when a robot goes quiet.</h1><p class="sub">A schedule table runs <b>check_heartbeats</b> every 100 ms. A robot silent for 300 ms is marked offline, and everyone else adapts in the same transaction.</p><div class="row"><button class="go" data-cut>Cut the carrier’s connection</button></div>`,

let scoreKind=null;function score(k){scoreKind=k;$('score').hidden=false}
function lineScore(){const s=sim;if(!s){$('score').innerHTML='';return}const m=s.m;
  $('score').innerHTML=`<div class="m"><span class="v ${cost(m)>0?'bad':'ok'}">${fmt$(cost(m))}</span><span class="k">${MODE_NAME[s.mode]} · cost of this run</span></div><div class="m"><span class="v ${m.br?'bad':''}">${m.br}</span><span class="k">glass broken</span></div><div class="m"><span class="v">${s.v.toFixed(2)}</span><span class="k">belt, m/s</span></div>`}
function phone(){const l=$('phList');if(!l||!sim)return;const rows=[['Loader arm',LD.status,C.ld],['Picker arm',PK.status,C.pk],['Mobile carrier',AMR.status,C.amr],['Conveyor',`belt at ${sim.v.toFixed(2)} m/s`,0x8A9096]];
  l.innerHTML=rows.map(([n,s,c])=>`<div class="r"><i style="background:#${c.toString(16).padStart(6,'0')}"></i><div><b>${n}</b><br><span>${s}</span></div></div>`).join('');
  const a=$('phAlert');if(a){const hold=sim.bel.ldHold;a.hidden=!hold;a.textContent='Line held while the carrier is at the racks'}}

let cur=-1;const slide=()=>SL[cur]||{};
const prog=$('prog');SL.forEach((s,i)=>{if(i&&SL[i-1].sec!==s.sec){const g=document.createElement('span');g.className='gap';prog.appendChild(g)}const b=document.createElement('button');b.setAttribute('aria-label',`Slide ${i+1}`);b.onclick=()=>go(i);prog.appendChild(b)});
function resetAll(){stopSim();nodes(false,false);F.visible=false;FS.on=false;ring.visible=false;WH.visible=true;tags.forEach(t=>{if(!flashes.includes(t))t.show(false)});$('score').hidden=true;scoreKind=null;showFlashes=true;
  armsHome();[LD,PK].forEach(a=>{a.parts[0].position.x=a.base.x;a.parts[1].position.x=a.base.x});AMR.x=DOCK.x;AMR.z=DOCK.z;AMR.g.userData.body.emissive.setRGB(0,0,0);closeInsp()}
function go(i){i=clamp(i,0,SL.length-1);if(i===cur)return;cur=i;resetAll();const s=SL[i];$('copy').innerHTML=NO(i,SECTIONS[s.sec])+s.html();$('notes').textContent=s.notes;
  $('sec').innerHTML=`${SECTIONS[s.sec]}<span>${String(i+1).padStart(2,'0')} / ${SL.length}</span>`;[...prog.querySelectorAll('button')].forEach((b,j)=>b.className=j===i?'cur':j<i?'done':'');
  if(s.setup)s.setup();camTo(s.cam);wire()}
function wire(){const c=$('copy');
  c.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(+x.dataset.go));c.querySelectorAll('[data-pulse]').forEach(x=>x.onclick=pulseAll);
  c.querySelectorAll('[data-slow]').forEach(x=>x.onclick=()=>{if(!sim||sim.done)startSim('relay',{schedule:[]});slowNow()});
  c.querySelectorAll('[data-tap]').forEach(x=>x.onclick=()=>{c.querySelectorAll('[data-tap]').forEach(y=>y.setAttribute('aria-pressed',String(y===x)));showTap(x.dataset.tap)});
  c.querySelectorAll('[data-onecopy]').forEach(x=>x.onclick=()=>{oneCopy();x.disabled=true;x.textContent='One shared copy'});
  c.querySelectorAll('[data-claim]').forEach(x=>x.onclick=()=>{armsClaimStage();claimDemo()});
  c.querySelectorAll('[data-sub]').forEach(x=>x.onclick=()=>subDemo(x.dataset.sub));
  c.querySelectorAll('[data-cut]').forEach(x=>x.onclick=()=>{cutCarrier();x.disabled=true});
  if($('fGo'))$('fGo').onclick=()=>buildRing(readForm());
  const cs=$('crewSel');if(cs)cs.querySelectorAll('button').forEach(x=>x.onclick=()=>{activeCrew=+x.dataset.c;cs.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',String(y===x)))});
  if($('roster'))paintCrews();
  c.querySelectorAll('[data-opt]').forEach(x=>x.onclick=()=>{optimize();x.textContent='Relay is on';x.disabled=true});
  c.querySelectorAll('[data-freset]').forEach(x=>x.onclick=()=>{fleetReset();const b=c.querySelector('[data-opt]');if(b){b.textContent='Turn on Relay';b.disabled=false}});
  if($('bars'))drawBars()}
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);$('spd').onchange=e=>{speed=+e.target.value};$('nBtn').onclick=()=>{$('notes').hidden=!$('notes').hidden};
addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='n'||e.key==='N')$('nBtn').click();else if(e.key==='Escape')closeInsp();else if(e.key==='p'||e.key==='P')paused=!paused;
  else if(e.key==='o'||e.key==='O'){const b=$('copy').querySelector('[data-opt]');if(b)b.click()}else if(e.key==='s'||e.key==='S'){const b=$('copy').querySelector('[data-slow]');if(b)b.click()}});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  if(ring.visible&&$('roster')){const hits=ray.intersectObjects(ringNodes.map(n=>n.g),true);if(hits&&hits.length){const o=hits[0].object;toggleNode(ringNodes.find(n=>{let p=o;while(p){if(p===n.g)return true;p=p.parent}return false}),e.shiftKey)}return}
  if(!WH.visible)return;for(const [arm,who] of [[LD,'LD'],[PK,'PK']]){const h=ray.intersectObjects(arm.parts,true);if(h&&h.length){openRobot(who);return}}const h=ray.intersectObjects([AMR.g],true);if(h&&h.length)openRobot('AMR')});

function resize(){const w=innerWidth,h=innerHeight,a=w/h,wide=w>820,half=a<1?HALF*1.75:HALF,offX=wide?half*a*.26:0,offY=wide?-half*.06:-half*.36;
  renderer.setSize(w,h,false);camera.left=-half*a-offX;camera.right=half*a-offX;camera.top=half+offY;camera.bottom=-half+offY;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),hudT=0,stT=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(64,now-last);last=now;const sdt=paused?0:dt/1000*speed;
  sun2.visible=F.visible;sun.visible=!F.visible;if(sim)step(sdt);fleetStep(sdt*.85);animateRing(dt/1000);stepCam(dt);
  [LD,PK].forEach(a=>{a.parts[0].position.x=a.base.x;a.parts[1].position.x=a.base.x;a.flash=Math.max(0,a.flash-dt/900);a.update()});AMR.g.position.set(AMR.x,0,AMR.z);
  for(let i=packets.length-1;i>=0;i--){const p=packets[i];if(!paused)p.t+=dt;if(p.t<0)continue;const t=Math.min(1,p.t/p.ms),first=t<.5,u=first?t*2:(t-.5)*2,e=u*u*(3-2*u);
    p.m.visible=true;p.m.position.lerpVectors(first?p.a:p.b,first?p.b:p.c,e);p.m.position.y+=Math.sin(e*Math.PI)*.15;if(t>=1){scene.remove(p.m);packets.splice(i,1)}}
  dbNode.rotation.y+=dt*.0005;
  if(now-hudT>150){hudT=now;if(scoreKind==='line')lineScore();else if(scoreKind==='fleet')fleetScore();updBeliefs();phone()}
  if(now-stT>350){stT=now;if(tStat.PK.on&&sim){tStat.LD.set(`<b>Loader arm</b>${LD.status}`);tStat.PK.set(`<b>Picker arm</b>${PK.status}`);tStat.AMR.set(`<b>Mobile carrier</b>${AMR.status}`);tStat.LINE.set(`<b>Conveyor</b>belt at ${sim.v.toFixed(2)} m/s`)}}
  inspTick(false);if(controls&&!cam)controls.update();placeTags();renderer.render(scene,camera)}
go(0);camTo('wide',true);requestAnimationFrame(frame);
window.__dbg={fAMRs,fArms,LEG,go,results,sim:()=>sim,FS,optimize,fleetReset,setSpeed:v=>{speed=v},startSim};
})();
</script>
