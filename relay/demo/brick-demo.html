<title>Relay Brick Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an isometric construction diorama fills the screen. A spec sheet panel on the left carries the slide; run metrics sit top right; an inspector drawer slides in from the right; slide rail along the bottom. One deliberate light "site drawing" look. */
:root{
  --paper:#E6E9EB; --sheet:#FBFBFA; --ink:#1B1F23; --muted:#5E676E; --rule:#C7CDD1; --faint:#EEF0F1;
  --brk:#E3A019; --mtr:#2F6E9E; --brick:#B4553A; --latent:#3A3FE0; --lang:#6B7178; --bad:#D92A2A; --ok:#1F8A4C;
  --display:"Archivo", "Arial Narrow", Arial, sans-serif; --body:"Archivo", "Helvetica Neue", Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);font-family:var(--mono);font-size:11px;white-space:nowrap;padding:2px 6px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);transition:opacity .3s}
.tag.off{opacity:0}
.tag.brk{border-color:var(--brk);box-shadow:inset 3px 0 0 var(--brk)} .tag.mtr{border-color:var(--mtr);box-shadow:inset 3px 0 0 var(--mtr)}
.tag.bad{background:var(--bad);color:#fff;border-color:var(--bad);font-weight:600}
.tag.db{border-color:var(--latent);color:var(--latent);font-weight:600} .tag.relay{border-color:var(--lang);color:var(--lang);font-weight:600}
.tag.say{white-space:normal;width:220px;font-family:var(--body);font-size:12px;line-height:1.35;padding:6px 8px}
.tag.note{background:transparent;border:0;color:var(--muted)}

#sheet{position:fixed;left:max(16px, env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(400px,36vw);
  background:var(--sheet);border:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden}
.sh-head{display:grid;grid-template-columns:auto 1fr auto;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sh-head > *{padding:7px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh-head > *+*{border-left:1px solid var(--rule)}
.sh-body{padding:18px 20px 20px;overflow:auto;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--latent)}
h1,h2{margin:0;font-family:var(--display);font-weight:850;font-stretch:112%;letter-spacing:-.01em;line-height:.98;text-wrap:balance}
h1{font-size:clamp(36px,4vw,54px)} h2{font-size:clamp(26px,2.6vw,36px)}
.lead{margin:0;font-size:16.5px;line-height:1.45}
.more{display:flex;flex-direction:column;gap:10px;font-size:14px;color:#333B41;border-top:1px solid var(--rule);padding-top:12px}
.more p{margin:0}.more b{color:var(--ink)}
.more ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
button{font-family:var(--body);font-weight:700;font-stretch:105%;font-size:14px;border-radius:0;cursor:pointer;padding:8px 12px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet)}
button.sec{background:var(--sheet);color:var(--ink)}
button.lat{background:var(--latent);border-color:var(--latent)}
button.link{background:transparent;border:0;color:var(--latent);padding:0;font-weight:600;text-align:left;align-self:flex-start}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--latent);outline-offset:2px}
.key{display:inline-block;font-family:var(--mono);font-size:10px;border:1px solid currentColor;opacity:.7;padding:0 4px;margin-left:6px;font-weight:500}
.cmp{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule)}
.cmp > div{padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}.cmp > div+div{border-left:1px solid var(--rule)}
.cmp .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.cmp .v{font-family:var(--display);font-weight:800;font-stretch:110%;font-size:22px;line-height:1}
.cmp .s{font-size:12px;color:var(--muted)}
.res{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.res th,.res td{border-bottom:1px solid var(--rule);padding:6px 4px;text-align:right}
.res th:first-child,.res td:first-child{text-align:left}
.res th{font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.res td.best{color:var(--ok);font-weight:700}.res td.worst{color:var(--bad);font-weight:700}
.modes{display:flex;border:1px solid var(--ink)}
.modes button{flex:1;border:0;background:var(--sheet);color:var(--ink);font-size:13px}.modes button+button{border-left:1px solid var(--ink)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

#hud{position:fixed;right:max(16px, env(safe-area-inset-right,0px));top:calc(16px + env(safe-area-inset-top,0px));width:250px;background:var(--sheet);border:1px solid var(--rule);font-size:12px}
#hud .mode{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
#hud .mode b{font-weight:600;text-align:right}
.mrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:5px 10px;border-bottom:1px solid var(--faint)}
.mrow span:last-child{font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.mrow.bad span:last-child{color:var(--bad)}.mrow.good span:last-child{color:var(--ok)}
#msgs{padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:11.5px;line-height:1.35;max-height:160px;overflow:hidden}
#msgs div{color:var(--muted)}#msgs div:first-child{color:var(--ink)}
#msgs div b{font-family:var(--mono);font-size:10px;font-weight:600}

#insp{position:fixed;right:0;top:0;bottom:0;width:min(470px,100vw);background:var(--sheet);border-left:1px solid var(--ink);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);z-index:5}
#insp.on{transform:none}
.in-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 12px 16px;border-bottom:1px solid var(--ink)}
.in-head h3{margin:0;font-family:var(--display);font-weight:850;font-stretch:110%;font-size:22px;line-height:1}
.in-head .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.in-body{overflow:auto;padding:0 max(16px, env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px}
.stage{border-bottom:1px solid var(--rule);padding:14px 0;display:flex;flex-direction:column;gap:8px}
.stage .st{display:flex;gap:10px;align-items:baseline}
.stage .n{font-family:var(--mono);font-size:11px;color:var(--latent);font-weight:600}
.stage .t{font-weight:800;font-stretch:108%;font-size:15px}
.stage .d{font-size:12.5px;color:var(--muted);margin:0}
.stage canvas{display:block;image-rendering:pixelated;border:1px solid var(--rule);max-width:100%}
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.layers div{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:10px;color:var(--muted)}
.layers canvas{width:100%;height:auto}
.heads{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.heads > div{border:1px solid var(--rule);padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.heads .h{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.heads q{font-size:12.5px}
.kv{display:grid;grid-template-columns:1fr auto;font-size:11.5px;gap:2px 8px}
.kv span:nth-child(even){font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.hover{font-family:var(--mono);font-size:11px;color:var(--latent);min-height:1.4em;padding-top:8px}
.vals{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
pre.code{margin:0;font-family:var(--mono);font-size:11px;line-height:1.5;background:var(--faint);border:1px solid var(--rule);padding:10px;overflow-x:auto;white-space:pre}
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--ink);padding:4px}
.tbl td{border-bottom:1px solid var(--faint);padding:4px;white-space:nowrap}
.tblwrap{overflow-x:auto}
.tasks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}
.tasks span{font-family:var(--mono);font-size:10px;text-align:center;padding:4px 0;border:1px solid var(--rule)}
.tasks .m{background:#D9E6F0;border-color:var(--mtr)} .tasks .b{background:#F3D8CF;border-color:var(--brick)} .tasks .x{background:var(--bad);color:#fff;border-color:var(--bad)}
.log{font-family:var(--mono);font-size:10.5px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.log div:first-child{color:var(--ink)}

#nav{position:fixed;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));height:48px;display:flex;align-items:stretch;background:var(--sheet);border:1px solid var(--rule)}
#nav > *+*{border-left:1px solid var(--rule)}
#nav > button{border:0;background:transparent;color:var(--ink);padding:0 14px;font-size:16px}
#ticks{flex:1;display:flex;min-width:0}
.tick{flex:1;min-width:0;border:0;background:transparent;font-family:var(--mono);font-size:10px;color:var(--muted);padding:0 4px;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tick+.tick{border-left:1px solid var(--faint)}
.tick.cur{color:var(--sheet);background:var(--ink)}
.tick.seen{color:var(--ink)}
.ctl{display:flex;align-items:center;gap:6px;padding:0 10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.ctl select{font-family:var(--mono);font-size:12px;border:1px solid var(--rule);background:var(--sheet);padding:3px}
#err{position:fixed;left:16px;bottom:72px;max-width:70vw;font-family:var(--mono);font-size:12px;color:var(--bad);white-space:pre-wrap;z-index:9}
@media (max-width:820px){
  #sheet{top:auto;bottom:calc(70px + env(safe-area-inset-bottom,0px));right:max(12px, env(safe-area-inset-right,0px));left:max(12px, env(safe-area-inset-left,0px));width:auto;max-height:42vh}
  .sh-body{padding:12px 14px;gap:10px}
  h1{font-size:32px} h2{font-size:24px} .lead{font-size:14.5px}
  #hud{width:190px;font-size:11px;top:calc(10px + env(safe-area-inset-top,0px));right:max(10px, env(safe-area-inset-right,0px))}
  #msgs{display:none}
  .tick{font-size:0}.tick::after{content:attr(data-n);font-size:10px}
  .ctl label{display:none}
  #nav{left:max(12px, env(safe-area-inset-left,0px));right:max(12px, env(safe-area-inset-right,0px))}
}
</style>

<canvas id="gl"></canvas>
<div id="tags"></div>

<aside id="sheet" aria-live="polite">
  <div class="sh-head"><span id="shNo">01 / 13</span><span>Relay · latent coordination</span><span>Sheet A</span></div>
  <div class="sh-body" id="shBody"></div>
</aside>

<div id="hud" hidden>
  <div class="mode"><span>Run</span><b id="hMode">—</b></div>
  <div class="mrow"><span>Time on the wall</span><span id="hT">0.0 s</span></div>
  <div class="mrow"><span>Bricks laid</span><span id="hB">0 / 18</span></div>
  <div class="mrow" id="rC"><span>Arm collisions</span><span id="hC">0</span></div>
  <div class="mrow" id="rD"><span>Bond defects</span><span id="hD">0</span></div>
  <div class="mrow" id="rE"><span>Mean placement error</span><span id="hE">—</span></div>
  <div class="mrow"><span>Coordination latency</span><span id="hL">—</span></div>
  <div id="msgs"></div>
</div>

<aside id="insp" aria-label="Inspector">
  <div class="in-head"><div><div class="k" id="inK">Inspector</div><h3 id="inT">BRK-1</h3></div><button class="sec" id="inClose">Close <span class="key">Esc</span></button></div>
  <div class="in-body" id="inBody"></div>
</aside>

<nav id="nav">
  <button id="prev" aria-label="Previous slide">←</button>
  <div id="ticks"></div>
  <div class="ctl"><label for="spd">speed</label><select id="spd"><option value="1">1×</option><option value="2">2×</option><option value="3" selected>3×</option><option value="4">4×</option><option value="8">8×</option></select></div>
  <button id="pause" aria-label="Pause">❚❚</button>
  <button id="next" aria-label="Next slide">→</button>
</nav>
<div id="err"></div>

const V3=THREE.Vector3,$=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let rand=rng(7);
const gauss=()=>{let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const C={paper:0xE6E9EB,brk:0xE3A019,mtr:0x2F6E9E,graph:0x2C3136,brick:0xB4553A,mortar:0xC9C3B6,foot:0xA7ACAF,latent:0x3A3FE0,lang:0x6B7178,bad:0xD92A2A};
const dist3=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y,a.z-b.z);

// ---------- wall geometry (meters) ----------
const P=.225,BL=.215,BH=.065,BD=.1025,J=.01,COLS=6,ROWS=3,N=COLS*ROWS,FOOT=.1;
const slots=[];
for(let i=0;i<N;i++){const r=Math.floor(i/COLS),c=i%COLS,x=-COLS*P/2+P/2+c*P+(r%2?P/4:-P/4),y0=FOOT+J+r*(BH+J);
  slots.push({i,r,c,x,y0,yc:y0+BH/2,brick:null,bead:null,beadKnown:false,claim:null,err:0,defect:null})}

const supported=s=>supports(s).every(o=>o.brick);

const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(C.paper);
const HALF=1.7;
const camera=new THREE.OrthographicCamera(-HALF,HALF,HALF,-HALF,.1,80);
camera.position.set(9,8,12);camera.zoom=1;

const sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(3.5,7,4.5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4,near:1,far:20});sun.shadow.bias=-.0004;sun.shadow.radius=3;scene.add(sun);

const mat=(c,r=.62,m=.05)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});

{const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');x.fillStyle='#D9DDDF';x.fillRect(0,0,1024,1024);
 for(let i=0;i<=80;i++){const p=i*1024/80;x.strokeStyle=i%5?'#CDD2D5':'#BCC3C7';x.lineWidth=i%5?1:1.6;x.beginPath();x.moveTo(p,0);x.lineTo(p,1024);x.moveTo(0,p);x.lineTo(1024,p);x.stroke()}
 x.setLineDash([10,8]);x.strokeStyle='#9AA3A9';x.lineWidth=2;x.strokeRect(1024*(.5-2.2/8),1024*(.5-1.9/8),1024*4.4/8,1024*3.8/8);x.setLineDash([]);
 x.fillStyle='#8E979D';x.font='600 15px "IBM Plex Mono", monospace';x.fillText('WORK ZONE A · GRID 0.1 M',1024*(.5-2.2/8)+8,1024*(.5-1.9/8)-8);
 const tex=new THREE.CanvasTexture(c);tex.anisotropy=4;
 const g=mesh(new THREE.PlaneGeometry(8,8),new THREE.MeshStandardMaterial({map:tex,roughness:1}),false,true);g.rotation.x=-Math.PI/2;scene.add(g);
 const far=mesh(new THREE.PlaneGeometry(60,60),mat(0xD9DDDF,1),false,true);far.rotation.x=-Math.PI/2;far.position.y=-.002;scene.add(far)}
const footing=mesh(new THREE.BoxGeometry(COLS*P+.45,FOOT,.3),mat(C.foot,.95));footing.position.y=FOOT/2;scene.add(footing);
for(const sx of [-1,1]){const st=mesh(new THREE.BoxGeometry(.03,.55,.03),mat(0x8a6a44,.9));st.position.set(sx*(COLS*P/2+.32),.275,.11);scene.add(st)}
{const g=new THREE.BufferGeometry().setFromPoints([new V3(-(COLS*P/2+.32),slots[N-1].y0+BH+.004,.11),new V3(COLS*P/2+.32,slots[N-1].y0+BH+.004,.11)]);
 scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xE0442E})))}
const PALLET_X=-1.5,DRUM_X=1.5,TRACK=.8;
{const pal=mesh(new THREE.BoxGeometry(.6,.1,.5),mat(0x9b7b55,.9));pal.position.set(PALLET_X,.05,1.45);scene.add(pal);
 const bm=mat(C.brick,.85);for(let l=0;l<4;l++)for(let k=0;k<4;k++){const b=mesh(new THREE.BoxGeometry(BL,BH,BD),bm);b.position.set(PALLET_X-.12+(k%2)*.235,.1+BH/2+l*BH,1.45-.11+Math.floor(k/2)*.115);scene.add(b)}
 const drum=mesh(new THREE.CylinderGeometry(.22,.22,.45,28),mat(0x7c8a94,.5,.3));drum.rotation.z=Math.PI/2;drum.position.set(DRUM_X,.42,-1.45);scene.add(drum);
 const legs=mesh(new THREE.BoxGeometry(.5,.22,.36),mat(C.graph,.7));legs.position.set(DRUM_X,.11,-1.45);scene.add(legs)}

// ---------- robots ----------
const L1=.48,L2=.48;
function stripeTex(){const c=document.createElement('canvas');c.width=256;c.height=32;const x=c.getContext('2d');x.fillStyle='#1B1F23';x.fillRect(0,0,256,32);x.fillStyle='#E3A019';
  for(let i=-2;i<20;i++){x.beginPath();x.moveTo(i*20,32);x.lineTo(i*20+10,0);x.lineTo(i*20+20,0);x.lineTo(i*20+10,32);x.fill()}return new THREE.CanvasTexture(c)}
class Robot{
  constructor(id,role,kind,side,color,x){Object.assign(this,{id,role,kind,side,color,x,home:x,stall:0,flash:0,carry:4,fill:4,yaw:0,sAng:0,eAng:0,tool:new V3(),toolDown:false,holding:null,status:'idle',open:.6,hit:false});
    this.t=new V3(x,.82,side*.5);this.g=new THREE.Group();scene.add(this.g);

  <div class="kicker">Our idea</div><h2>Share the latent, not the sentence</h2>
  <p class="lead">Each robot publishes its latent vector and its intended action straight into a shared database. The partner reads the numbers directly. No words in the loop.</p>
  <div class="actions"><button data-pulse>Send a latent frame</button><button class="sec" data-db>Open SpacetimeDB</button></div>
  <button class="link" data-more>Go deeper ↓</button><div class="more" hidden>
  <p><b>What goes in a frame.</b> The latent z, the decoded action (tool pose and timing), and the zone it is about to use.</p>
  <p><b>Different robots, same language.</b> If both robots share an encoder, their vectors already mean the same thing. If they don't, a small learned adapter maps one space onto the other. It is trained once, then runs in microseconds.</p>
  <p><b>Why precision survives.</b> Nothing gets rounded into words, so the partner receives the exact pose the sender planned.</p></div>`},
{n:'SpacetimeDB',cam:'db',setup(){prebuild(7);dbNode.visible=true;tDB.show();setTimeout(()=>{if(cur===8&&!insp)openDB()},450)},html:`
  <div class="kicker">The shared workspace</div><h2>SpacetimeDB is the hive mind</h2>
  <p class="lead">Robots write rows. Reducers enforce the rules. Every subscriber sees each change within milliseconds.</p>
  <div class="actions"><button data-db>Open the tables</button></div>
  <button class="link" data-more>Go deeper ↓</button><div class="more" hidden>
  <ul><li><b>robot_state:</b> where each robot is and what it is doing.</li><li><b>latent_frame:</b> the shared thoughts, one row per frame.</li>
  <li><b>zone_claim:</b> a reservation of the air above one brick slot. Two arms can never hold the same slot, because the reducer rejects the second claim.</li>
  <li><b>task:</b> the wall, slot by slot. “No brick without mortar” and “no mortar without support” live in the reducers, so no robot can break them.</li></ul>
  <p>Reducers run as transactions inside the database, and subscriptions push the result to every robot and every screen. That is the whole sync layer.</p></div>`},
{n:'Latent run',cam:'connect',setup(){tB.show();tM.show();dbNode.visible=true;tDB.show();showHud(true)},html:`
  <div class="kicker">Run 3 of 3</div><h2>Latent coordination</h2>
  <p class="lead">Same robots, same wall. Now they share thoughts and claim airspace through SpacetimeDB.</p>
  <div class="actions"><button class="lat" data-run="latent">Run it <span class="key">R</span></button><button class="sec" data-db>Watch the tables</button></div>
  <button class="link" data-more>Go deeper ↓</button><div class="more" hidden>
  <p><b>Pipelining.</b> BRK-1 stages next to a slot while MTR-2 is still printing it, and moves in the moment the claim is released. Nobody waits for a sentence.</p>
  <p><b>Claims.</b> The colored boxes are live zone claims. Neighboring slots can be worked at the same time because the claims are exact.</p>
  <p><b>Precision.</b> BRK-1 gets the exact planned pose, so placement error stays under a millimeter.</p>
  <p>Packets are slowed down so you can see them. The modeled latency is 20 ms.</p></div>`},
{n:'Head to head',cam:'hero',setup(){prebuild(18)},html:`<div class="kicker">Results</div><h2>Head to head</h2>
  <p class="lead">Numbers from the runs on this screen. Each run builds the full 18 brick wall.</p><div id="resT"></div>
  <div class="actions"><button data-runall>Run any missing modes</button></div>
  <p class="lead" style="font-size:13px;color:var(--muted)">Simulated robots and modeled latencies. Collisions and defects come out of the simulation, not a script.</p>`},
{n:'Free play',cam:'hero',setup(){tB.show();tM.show()},html:`<div class="kicker">Try it</div><h2>Free play</h2>
  <p class="lead">Pick a mode and run it. Click a robot or the database to look inside. Drag to orbit, scroll to zoom.</p>
  <div class="modes" id="mSel"><button data-m="none" aria-pressed="false">None</button><button data-m="language" aria-pressed="false">Language</button><button data-m="latent" aria-pressed="true">Latent</button></div>
  <div class="actions"><button data-free>Run selected <span class="key">R</span></button><button class="sec" data-reset>Clear the wall</button><button class="sec" data-db>SpacetimeDB</button></div>`},
{n:'What is real',cam:'hero',setup(){prebuild(18)},html:`<div class="kicker">Honest notes</div><h2>What is real, and what comes next</h2>
  <div class="more"><ul>
  <li><b>Real:</b> the SpacetimeDB design. Tables for robot state, latent frames, zone claims, and tasks, with reducers that enforce order and airspace.</li>
  <li><b>Simulated:</b> the robots, their timing, and the latencies. Collisions and defects come out of the simulation.</li>
  <li><b>Small on purpose:</b> the encoder in the inspector uses fixed weights so it runs in a browser. Same shapes and flow as a real one.</li>
  <li><b>Next:</b> a shared encoder such as SigLIP on both robots, a learned adapter for robots with different models, and real VLA policies (OpenVLA, π0) reading a partner's latent as extra input.</li></ul></div>
  <p class="lead">Robots don't need to talk to work together. They need to share what they know.</p>
  <div class="actions"><button data-go="0">Back to start</button></div>`}
];
function demoPulse(){sendPackets(new V3(MTR.x,.7,MTR.side*TRACK),DBP,new V3(BRK.x,.7,BRK.side*TRACK),C.latent,8,900);reducer('publish_latent',`MTR-2, frame ${++db.frame}, 512 dims`)}
let cur=-1;const slide=()=>SL[cur]||{};
const ticks=$('ticks');SL.forEach((s,i)=>{const b=document.createElement('button');b.className='tick';b.dataset.n=i+1;b.textContent=`${i+1} ${s.n}`;b.title=s.n;b.onclick=()=>go(i);ticks.appendChild(b)});
function hideScene(){air.visible=airEdge.visible=false;dbNode.visible=relayNode.visible=false;tags.forEach(t=>{if(!flashTags.includes(t))t.show(false)});showHud(false)}
function go(i){i=clamp(i,0,SL.length-1);if(i===cur)return;cur=i;resetSim();hideScene();if(insp){insp=null;$('insp').classList.remove('on')}
  const s=SL[i];$('shNo').textContent=`${String(i+1).padStart(2,'0')} / ${SL.length}`;$('shBody').innerHTML=s.html;$('shBody').scrollTop=0;
  [...ticks.children].forEach((t,j)=>t.className='tick'+(j===i?' cur':j<i?' seen':''));
  if(s.setup)s.setup();camTo(viewFor(s.cam));wire()}
function wire(){const b=$('shBody');
  b.querySelectorAll('[data-go]').forEach(x=>x.onclick=()=>go(+x.dataset.go));
  b.querySelectorAll('[data-more]').forEach(x=>x.onclick=()=>{const m=x.nextElementSibling;m.hidden=!m.hidden;x.textContent=m.hidden?'Go deeper ↓':'Less ↑'});
  b.querySelectorAll('[data-insp]').forEach(x=>x.onclick=()=>openRobot(x.dataset.insp==='brk'?BRK:MTR));
  b.querySelectorAll('[data-db]').forEach(x=>x.onclick=openDB);
  b.querySelectorAll('[data-pulse]').forEach(x=>x.onclick=demoPulse);
  b.querySelectorAll('[data-run]').forEach(x=>x.onclick=()=>startRun(x.dataset.run));
  const cv=$('cv1');if(cv){const r0=rand;rand=rng(3);heat(cv,[Array.from({length:64},()=>Math.tanh(gauss()*.9))],4);rand=r0}
  const sel=b.querySelector('#mSel');if(sel)sel.querySelectorAll('button').forEach(x=>x.onclick=()=>sel.querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',String(y===x))));
  b.querySelectorAll('[data-free]').forEach(x=>x.onclick=()=>startRun(sel.querySelector('[aria-pressed="true"]').dataset.m));
  b.querySelectorAll('[data-reset]').forEach(x=>x.onclick=()=>{resetSim();showHud(false)});
  b.querySelectorAll('[data-runall]').forEach(x=>x.onclick=runAll);
  if($('resT'))drawResults()}
function drawResults(){const ms=['none','language','latent'],fm=v=>(v<1?v.toFixed(2):v.toFixed(0))+' mm';
  const rows=[['Time to build','t',v=>v.toFixed(1)+' s'],['Arm collisions','coll',v=>v],['Bond defects','def',v=>v],['Mean placement error','err',fm],['Worst brick','max',fm],['Coordination latency','lat',v=>v?Math.round(v)+' ms':'none',true]];
  let h='<table class="res"><tr><th></th><th>None</th><th>Language</th><th>Latent</th></tr>';
  for(const [lab,k,f,noRank] of rows){const vals=ms.map(m=>results[m]?results[m][k]:null),have=vals.filter(v=>v!==null);
    h+=`<tr><td>${lab}</td>`+vals.map(v=>{if(v===null)return'<td>—</td>';let c='';if(!noRank&&have.length>1&&Math.min(...have)!==Math.max(...have)){if(v===Math.min(...have))c='best';else if(v===Math.max(...have))c='worst'}return`<td class="${c}">${f(v)}</td>`}).join('')+'</tr>'}
  $('resT').innerHTML=h+'</table>'}
async function runAll(){const old=speed;speed=8;$('spd').value='8';const me=cur;
  for(const m of ['none','language','latent']){if(results[m])continue;await startRun(m);if(cur!==me)break}
  speed=old;$('spd').value=String(old);if(cur===me){resetSim();prebuild(18);showHud(false);drawResults()}}

$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'❚❚';$('pause').setAttribute('aria-label',paused?'Resume':'Pause')};
$('spd').onchange=e=>{speed=+e.target.value};
addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  else if(e.key==='Escape'&&insp)closeInsp();else if(e.key==='p'||e.key==='P')$('pause').click();
  else if(e.key==='r'||e.key==='R'){const b=$('shBody').querySelector('[data-run],[data-free]');if(b)b.click()}});
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>5)return;ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const parts=[BRK.g,BRK.s1,BRK.s2,MTR.g,MTR.s1,MTR.s2,dbNode];const hits=ray.intersectObjects(parts,true);if(!hits||!hits.length)return;let o=hits[0].object;
  while(o&&!parts.includes(o))o=o.parent;
  if(o===dbNode){if(dbNode.visible)openDB()}else if(o===BRK.g||o===BRK.s1||o===BRK.s2)openRobot(BRK);else if(o)openRobot(MTR)});

// ---------- loop ----------
function resize(){const w=innerWidth,h=innerHeight,a=w/h,wide=w>820,half=a<1?HALF*1.7:HALF,offX=wide?half*a*.3:0,offY=wide?0:half*.4;
  renderer.setSize(w,h,false);camera.left=-half*a-offX;camera.right=half*a-offX;camera.top=half-offY;camera.bottom=-half-offY;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),hudT=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(64,now-last);last=now;
  stepSim(dt);stepCam(dt);checkCollision(paused?0:dt*speed);
  for(const r of robots)r.update();
  for(let i=packets.length-1;i>=0;i--){const p=packets[i];if(!paused)p.t+=dt;if(p.t<0)continue;const t=Math.min(1,p.t/p.ms),first=t<.5,u=first?t*2:(t-.5)*2,e=u*u*(3-2*u);
    p.m.visible=true;p.m.position.lerpVectors(first?p.a:p.b,first?p.b:p.c,e);p.m.position.y+=Math.sin(e*Math.PI)*.15;if(t>=1){scene.remove(p.m);packets.splice(i,1)}}
  dbNode.rotation.y+=dt*.0006;
  if(now-hudT>120){hudT=now;updHud()}
  inspTick(false);
  if(controls&&!cam)controls.update();
  placeTags();renderer.render(scene,camera)}
go(0);camTo(VIEWS.hero,true);
requestAnimationFrame(frame);
window.__dbg={startRun,results,run:()=>run,go,setSpeed:v=>{speed=v}};
})();
</script>
